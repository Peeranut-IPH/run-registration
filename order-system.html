<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วิ่งล้อมเมือง — สนับสนุนเพื่อรับเสื้อที่ระลึก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#39785f;
    --navy-deep:#2f6f5b;
    --cream:#fff9ee;
    --card:#ffffff;
    --orange:#ea83ad;
    --orange-deep:#ca4e82;
    --teal:#3f8d74;
    --teal-light:#eaf7f1;
    --pink-soft:#fff0f6;
    --ink:#3e685c;
    --muted:#897a80;
    --line:#d7e7df;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#fff8fb;
    font-family:'Noto Sans Thai','Noto Sans',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:linear-gradient(180deg,#fff8fb 0%,#ffffff 50%,#fffaf2 100%);
    position:relative;
    box-shadow:0 0 40px rgba(125,77,99,.08);
  }

  /* ---- Header ---- */
  .header{
    background:
      radial-gradient(circle at 86% 15%,rgba(255,255,255,.12) 0 16%,transparent 17%),
      linear-gradient(135deg,#ec81ac 0%,#d86596 54%,#609b82 100%);
    color:#fff;
    padding:28px 22px 34px;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute;
    right:-40px;top:-40px;
    width:160px;height:160px;
    border-radius:50%;
    border:2px dashed rgba(255,255,255,.4);
  }
  .eyebrow{
    font-family:'Kanit',sans-serif;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#fff;
    opacity:.88;
    margin:0 0 10px;
  }
  .title{
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:32px;
    line-height:1.15;
    margin:0 0 8px;
  }
  .subtitle{
    font-size:13.5px;
    color:#fff;
    margin:0;
    line-height:1.6;
  }
  .header-organization{
    margin:5px 0 0;
    font-size:12px;
    line-height:1.7;
    color:#fff;
  }

  /* ---- Tabs ---- */
  .tabs{
    display:flex;
    gap:8px;
    margin:-20px 16px 0;
    background:var(--card);
    border-radius:14px;
    padding:5px;
    border:1px solid rgba(215,231,223,.9);
    box-shadow:0 10px 28px rgba(164,79,119,.12);
    position:relative;
    z-index:2;
  }
  .tab{
    flex:1;
    border:none;
    background:transparent;
    padding:12px 8px;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:14.5px;
    border-radius:10px;
    color:var(--muted);
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab.active{
    background:var(--navy);
    color:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  }

  .content{padding:18px 16px 40px;}

  .price-pill{
    display:inline-block;
    background:var(--pink-soft);
    color:var(--orange-deep);
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:6px 13px;
    border-radius:999px;
    white-space:nowrap;
  }

  /* ---- Design preview (front/back) ---- */
  .design-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 16px 16px;
    margin-bottom:18px;
    box-shadow:0 8px 22px rgba(133,96,107,.055);
  }
  .design-card .design-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .design-card .design-head h3{
    font-family:'Kanit',sans-serif;
    font-size:15px;
    margin:0;
    color:var(--navy);
  }
  .design-card .placeholder-tag{
    font-size:10.5px;
    color:var(--teal);
    background:var(--teal-light);
    border:1px dashed #a9d3c1;
    padding:3px 9px;
    border-radius:999px;
    font-weight:600;
  }
  .design-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .design-piece{
    text-align:center;
  }
  .design-piece .shirt-frame{
    border-radius:14px;
    overflow:hidden;
    aspect-ratio:3/5;
    border:1px solid var(--line);
    background:#fff;
  }
  .design-piece .shirt-frame svg{width:100%;height:100%;display:block;}
  .design-piece .shirt-frame img{width:100%;height:100%;display:block;object-fit:contain;}
  .design-piece .cap{
    margin-top:8px;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--navy);
  }
  .design-card .design-foot{
    margin-top:12px;
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    line-height:1.6;
  }
  .status-alert{
    background:var(--pink-soft);
    border:1px solid #efc3d1;
    color:#9b526d;
    font-size:12px;
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    line-height:1.6;
  }
  .store-gate{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 8px 22px rgba(133,96,107,.055);
  }
  .store-gate .icon{
    width:54px;height:54px;
    margin:0 auto 14px;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--pink-soft);
    color:var(--orange-deep);
    font-size:25px;
  }
  .store-gate.loading .icon{background:var(--teal-light);color:var(--teal);}
  .store-gate h2{margin:0 0 8px;font:700 21px 'Kanit',sans-serif;color:var(--navy);}
  .store-gate p{margin:0;color:var(--muted);font-size:13px;line-height:1.7;}
  .store-gate button{margin-top:18px;width:auto;padding:10px 22px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:600 14px 'Kanit',sans-serif;cursor:pointer;}

  /* ---- Form ---- */
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:13.5px;
    margin-bottom:7px;
    color:var(--navy);
  }
  .field input[type=text], .field input[type=tel], .field textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:12px;
    padding:13px 14px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field-hint{
    margin-top:6px;
    font-size:11.5px;
    color:var(--muted);
    line-height:1.5;
  }

  .size-list{
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
  }
  .size-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .size-row:last-child{border-bottom:none;}
  .size-row.has-qty{background:var(--teal-light);}
  .size-row.is-unavailable{background:#f7f7f7;opacity:.62;}
  .size-row .size-label{
    display:flex;
    align-items:baseline;
    gap:7px;
    flex-shrink:0;
    width:74px;
  }
  .size-chip{
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--navy);
  }
  .size-row .chest{
    font-size:10.5px;
    color:var(--muted);
    white-space:nowrap;
  }
  .size-row .subtotal{
    font-size:12px;
    color:var(--teal);
    font-weight:600;
    flex:1;
    text-align:left;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .stepper button{
    width:30px;height:30px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-size:16px;
    font-weight:600;
    color:var(--navy);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .stepper button:active{background:var(--teal-light);}
  .stepper button:disabled{cursor:not-allowed;opacity:.4;background:#f1f1f1;}
  .stepper .qty{
    min-width:16px;
    text-align:center;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }

  .method-toggle{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  .method-toggle button{
    flex:1;
    padding:13px 8px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:'Noto Sans Thai',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .method-toggle button.active{
    border-color:var(--teal);
    color:var(--teal);
    background:var(--teal-light);
  }

  .summary{
    border-top:1px dashed var(--line);
    margin-top:18px;
    padding-top:14px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .summary-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'Kanit',sans-serif;
    margin-top:10px;
  }
  .summary-total .lbl{font-weight:600;font-size:15px;color:var(--navy);}
  .summary-total .amt{font-weight:700;font-size:24px;color:var(--orange-deep);font-variant-numeric:tabular-nums;}

  /* ---- Payment and slip ---- */
  .payment-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 16px;
    margin-top:18px;
    box-shadow:0 8px 22px rgba(133,96,107,.055);
  }
  .payment-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .payment-head h3{
    font-family:'Kanit',sans-serif;
    color:var(--navy);
    font-size:16px;
    margin:0 0 3px;
  }
  .payment-head p{
    color:var(--muted);
    font-size:11.5px;
    line-height:1.5;
    margin:0;
  }
  .verified-badge{
    flex-shrink:0;
    color:var(--teal);
    background:var(--teal-light);
    border:1px solid #c8e5d6;
    border-radius:999px;
    padding:4px 9px;
    font-size:10px;
    font-weight:600;
  }
  .payment-steps{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin:0 0 14px;
  }
  .payment-step{
    background:#fff7fa;
    border-radius:10px;
    padding:8px 4px;
    text-align:center;
    color:var(--muted);
    font-size:10.5px;
    line-height:1.35;
  }
  .payment-step span{
    width:21px;height:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 4px;
    border-radius:50%;
    background:var(--teal-light);
    color:var(--teal);
    font-family:'Kanit',sans-serif;
    font-weight:700;
  }
  .account-box{
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px 14px;
    background:#fff;
  }
  .account-name{
    font-family:'Kanit',sans-serif;
    font-weight:600;
    color:var(--navy);
    font-size:14px;
  }
  .account-no{
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
  }
  .payment-amount{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:11px;
    padding-top:11px;
    border-top:1px dashed var(--line);
  }
  .payment-amount .label{font-size:12px;color:var(--muted);}
  .payment-amount strong{
    font-family:'Kanit',sans-serif;
    color:var(--orange-deep);
    font-size:20px;
  }
  .copy-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--navy);
    padding:7px 10px;
    border-radius:9px;
    font-family:'Kanit',sans-serif;
    font-size:11px;
    cursor:pointer;
  }
  .copy-btn:disabled{color:#b4c7bd;cursor:not-allowed;}
  .qr-payment{
    margin-top:12px;
    border:1px solid #c8e5d6;
    border-radius:13px;
    background:var(--teal-light);
    overflow:hidden;
  }
  .qr-payment summary{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 14px;
    color:var(--teal);
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    list-style:none;
    user-select:none;
  }
  .qr-payment summary::-webkit-details-marker{display:none;}
  .qr-payment summary::before{
    content:'＋';
    width:20px;height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#fff;
    color:var(--teal);
    font-size:14px;
    line-height:1;
  }
  .qr-payment[open] summary::before{content:'−';}
  .qr-payment .close-label{display:none;}
  .qr-payment[open] .open-label{display:none;}
  .qr-payment[open] .close-label{display:inline;}
  .qr-panel{
    border-top:1px solid #c8e5d6;
    padding:14px 12px 16px;
    text-align:center;
    background:#fff;
  }
  .qr-panel h4{
    margin:0;
    color:var(--navy);
    font-family:'Kanit',sans-serif;
    font-size:15px;
  }
  .qr-panel p{
    margin:3px 0 10px;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
  }
  .qr-panel img{
    display:block;
    width:min(100%,330px);
    height:auto;
    margin:0 auto;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
  }
  .qr-amount{
    display:inline-block;
    margin-top:10px;
    padding:5px 12px;
    border-radius:999px;
    background:var(--pink-soft);
    color:var(--orange-deep);
    font-family:'Kanit',sans-serif;
    font-size:14px;
  }
  .slip-section{margin-top:15px;}
  .payment-warning{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin-top:12px;
    padding:11px 12px;
    border:1px solid #efc4d0;
    border-radius:12px;
    background:#fff6f8;
    color:#8f4d64;
    font-size:11.5px;
    line-height:1.65;
  }
  .payment-warning .warning-icon{
    flex:0 0 auto;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--pink-soft);
    color:var(--orange-deep);
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:13px;
  }
  .payment-warning strong{
    color:var(--orange-deep);
    font-family:'Kanit',sans-serif;
    font-weight:600;
  }
  .slip-section > label{
    display:block;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    color:var(--navy);
    font-size:13.5px;
    margin-bottom:7px;
  }
  .required-mark{color:var(--orange-deep);}
  .slip-picker{
    display:block;
    border:1.5px dashed #a9d3c1;
    border-radius:13px;
    padding:17px 12px;
    text-align:center;
    background:var(--teal-light);
    color:var(--navy);
    font-family:'Kanit',sans-serif;
    font-size:13px;
    cursor:pointer;
  }
  .slip-picker small{
    display:block;
    color:var(--muted);
    font-family:'Noto Sans Thai',sans-serif;
    font-size:10.5px;
    margin-top:3px;
  }
  .slip-input{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
  }
  .slip-preview{
    display:flex;
    align-items:center;
    gap:11px;
    border:1px solid var(--line);
    border-radius:13px;
    padding:10px;
    background:#fff;
  }
  .slip-preview img{
    width:64px;height:64px;
    border-radius:9px;
    object-fit:cover;
    border:1px solid var(--line);
  }
  .slip-meta{min-width:0;flex:1;}
  .slip-meta strong{
    display:block;
    color:var(--teal);
    font-family:'Kanit',sans-serif;
    font-size:13px;
  }
  .slip-meta span{
    display:block;
    color:var(--muted);
    font-size:10.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .remove-slip{
    border:none;
    background:transparent;
    color:var(--orange-deep);
    font-family:'Kanit',sans-serif;
    font-size:11px;
    padding:5px;
    cursor:pointer;
  }
  .prototype-note{
    margin-top:11px;
    padding:10px 12px;
    border-radius:11px;
    background:var(--pink-soft);
    color:#9b526d;
    font-size:10.8px;
    line-height:1.6;
  }
  .submit-hint{
    color:var(--muted);
    text-align:center;
    font-size:11px;
    margin-top:8px;
  }
  .privacy-consent{
    margin-top:14px;
    color:var(--muted);
    text-align:center;
    font-size:11px;
    line-height:1.6;
  }
  .privacy-consent a{
    color:var(--orange-deep);
    font-weight:600;
    text-underline-offset:2px;
  }

  .submit-btn{
    width:100%;
    margin-top:16px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--orange-deep);
    color:#fff;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .submit-btn:disabled{
    background:#c9dfd5;
    color:#fff;
    cursor:not-allowed;
  }
  .submit-btn:not(:disabled):active{background:var(--orange-deep);}

  .error-text{
    color:var(--orange-deep);
    font-size:12.5px;
    margin-top:6px;
  }

  /* ---- Confirmation ---- */
  .confirm{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 20px;
    text-align:center;
  }
  .confirm .check{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--teal-light);
    color:var(--teal);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;
    font-size:26px;
  }
  .confirm h3{font-family:'Kanit',sans-serif;margin:0 0 4px;font-size:19px;}
  .confirm p{font-size:13px;color:var(--muted);margin:0 0 18px;}
  .confirm .ref{
    font-family:'Kanit',sans-serif;
    background:var(--teal-light);
    color:var(--teal);
    padding:8px 14px;
    border-radius:10px;
    display:inline-block;
    font-size:13px;
    margin-bottom:16px;
  }
  .confirm .note{
    text-align:left;
    background:var(--cream);
    border-radius:12px;
    padding:14px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.7;
  }
  .confirm .back-btn{
    margin-top:16px;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }

  /* ---- Private order lookup ---- */
  .lookup-card,
  .order-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 16px;
    box-shadow:0 8px 22px rgba(133,96,107,.055);
  }
  .lookup-card h2{
    font-family:'Kanit',sans-serif;
    color:var(--navy);
    font-size:20px;
    margin:0 0 6px;
  }
  .lookup-card .intro{
    color:var(--muted);
    font-size:12.5px;
    line-height:1.65;
    margin:0 0 18px;
  }
  .lookup-card .submit-btn{margin-top:4px;}
  .privacy-note{
    margin-top:14px;
    background:var(--teal-light);
    border-radius:12px;
    padding:11px 13px;
    color:var(--teal);
    font-size:11.5px;

  .order-card{
    margin-top:14px;

  .lookup-count{
    margin:16px 2px 2px;
    color:var(--navy);
    font-family:'Kanit',sans-serif;

  }
  .order-card .top{
    display:flex;

  .order-card .name{

  .order-card .time{

  }
  .order-card .order-ref{
    display:inline-block;
    margin:0 0 7px;
    padding:3px 9px;
    border-radius:999px;
    background:var(--pink-soft);

    font-family:'Kanit',sans-serif;
    font-weight:600;

  }
  .order-card .masked-contact{
    font-size:12px;
    color:var(--teal);
    font-weight:500;
    margin-bottom:6px;
  }
  .order-card .sizes{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;

  .order-card .bottom{

    justify-content:space-between;

  .order-card .method-badge{

  }

  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="header">
    <p class="eyebrow">RUN AROUND THE CITY · HEALTHY CITY</p>
    <h1 class="title">วิ่งล้อมเมือง</h1>
    <p class="subtitle">สนับสนุนเพื่อรับเสื้อที่ระลึก</p>
    <p class="header-organization">โรงพยาบาลกลาง สำนักการแพทย์ · เขตราชเทวี - เขตพญาไท</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabOrder">สั่งซื้อ</button>
    <button class="tab" id="tabLookup">ตรวจสอบคำสั่งซื้อ</button>
  </div>

  <div class="content" id="content"></div>

</div>

<script>
(function(){
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz1IH-RT9X1-ilpni6YQUf0OSOhnWHYi_dxBUuKFxg1UXVMZ0C-xjmSi99YsB6pORqdmw/exec';
  const SIZES = ["S","M","L","XL","2XL","3XL","4XL","5XL"];
  const CHEST = {S:38,M:40,L:42,XL:44,"2XL":46,"3XL":48,"4XL":50,"5XL":52};
  const PRICE = 250;
  const SHIP_FEE = 50;

  function createDefaultShirtStatus(){
    return {
      success: true,
      storeOpen: true,
      acceptingOrders: true,
      reason: "open",
      message: "เปิดรับคำสั่งซื้อ",
      shirtPrice: PRICE,
      shippingFee: SHIP_FEE,
      maxSlipMb: 4,
      sizes: SIZES.map((size, index)=>({
        size,
        chestInch: CHEST[size],
        price: PRICE,
        remaining: index < 6 ? 200 : 100,
        open: true,
        available: true
      }))
    };
  }

  function emptyQty(){
    const q = {};
    SIZES.forEach(s=>q[s]=0);
    return q;
  }

  let state = {
    view: "order",
    name: "",
    phone: "",
    qty: emptyQty(),
    method: "pickup_hospital",
    address: "",
    slipFile: null,
    slipPreviewUrl: "",
    slipOriginalSize: 0,
    slipProcessing: false,
    slipProcessStage: "",
    slipUploadToken: "",
    slipError: "",
    submitting: false,
    submitStage: "",
    pendingRequestId: "",
    error: "",
    confirmedOrder: null,
    lookupPhone: "",
    lookupLoading: false,
    lookupError: "",
    lookupResults: [],
    shirtStatus: createDefaultShirtStatus(),
    shirtStatusLoading: false,
    shirtStatusRefreshing: false,
    shirtStatusError: ""
  };

  const content = document.getElementById("content");
  const tabOrder = document.getElementById("tabOrder");
  const tabLookup = document.getElementById("tabLookup");

  function totalQty(){
    return SIZES.reduce((s,k)=>s+state.qty[k],0);
  }
  function currentShirtPrice(){
    const value = state.shirtStatus && Number(state.shirtStatus.shirtPrice);
    return Number.isFinite(value) && value >= 0 ? value : PRICE;
  }
  function currentShippingFee(){
    const value = state.shirtStatus && Number(state.shirtStatus.shippingFee);
    return Number.isFinite(value) && value >= 0 ? value : SHIP_FEE;
  }
  function currentMaxSlipMb(){
    const value = state.shirtStatus && Number(state.shirtStatus.maxSlipMb);
    return Number.isFinite(value) && value > 0 ? value : 4;
  }
  function getShirtSizeStatus(size){
    const sizes = state.shirtStatus && Array.isArray(state.shirtStatus.sizes)
      ? state.shirtStatus.sizes
      : [];
    return sizes.find(item=>String(item.size).toUpperCase()===size) || null;
  }
  function totalPrice(){
    const shirtTotal = SIZES.reduce((sum,size)=>{
      const item = getShirtSizeStatus(size);
      const unitPrice = item && Number.isFinite(Number(item.price))
        ? Number(item.price)
        : currentShirtPrice();
      return sum + state.qty[size]*unitPrice;
    },0);
    return shirtTotal + (state.method==="mail" && totalQty()>0 ? currentShippingFee() : 0);
  }

  function setState(patch){
    Object.assign(state, patch);
    render();
  }

  function reconcileQtyWithStock(){
    SIZES.forEach(size=>{
      const item = getShirtSizeStatus(size);
      const remaining = item ? Math.max(0, Number(item.remaining) || 0) : 0;
      if(!item || !item.available) state.qty[size] = 0;
      else state.qty[size] = Math.min(state.qty[size], remaining);
    });
  }

  async function refreshShirtStatus(options={}){
    if(state.shirtStatusRefreshing) return false;
    const silent = Boolean(options.silent);
    state.shirtStatusRefreshing = true;
    if(!silent && !state.shirtStatus){
      state.shirtStatusLoading = true;
      render();
    }
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    const timeoutId = controller ? setTimeout(()=>controller.abort(), 8000) : null;
    try{
      const response = await fetch(WEB_APP_URL + '?action=shirt-status', {
        method:'GET',
        cache:'no-store',
        redirect:'follow',
        signal: controller ? controller.signal : undefined
      });
      if(!response.ok) throw new Error('โหลดสถานะร้านไม่สำเร็จ');
      const result = await response.json();
      if(!result.success) throw new Error(result.message || 'ไม่พบสถานะร้าน');
      state.shirtStatus = result;
      state.shirtStatusError = '';
      reconcileQtyWithStock();
      return true;
    }catch(error){
      state.shirtStatusError = 'ขณะนี้ระบบตรวจสอบสต็อกใช้เวลานาน กรุณารอสักครู่และลองใหม่ก่อนยืนยันคำสั่งซื้อ';
      return false;
    }finally{
      if(timeoutId) clearTimeout(timeoutId);
      state.shirtStatusLoading = false;
      state.shirtStatusRefreshing = false;
      render();
    }
  }

  /* Placeholder shirt artwork — swap these SVGs for real product photos
     once they're available (e.g. two <img src="..."> tags pointing at the
     uploaded front/back photos). Colors echo the event's pink-to-gold
     gradient and Bangkok skyline so the placeholder still feels on-brand. */
  function shirtSVG(isBack){
    const gradId = isBack ? "gradBack" : "gradFront";
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ec81ac"/>
          <stop offset="55%" stop-color="#d86596"/>
          <stop offset="100%" stop-color="#609b82"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" fill="#fff"/>
      <path d="M33,17 L43,11 Q50,18 57,11 L67,17 L83,30 L72,41 L67,35 L67,82 L33,82 L33,35 L28,41 L17,30 Z"
        fill="url(#${gradId})" stroke="#fff" stroke-width="1.5"/>
      <path d="M43,11 Q50,18 57,11" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="14" y="63" width="72" height="5" fill="#ffffff" opacity="0.18"/>
      <rect x="14" y="72" width="72" height="3.5" fill="#ffffff" opacity="0.12"/>
      ${isBack
        ? `<text x="50" y="46" text-anchor="middle" font-family="Kanit, sans-serif" font-weight="700" font-size="6.5" fill="#ffffff">BKK</text>
           <text x="50" y="57" text-anchor="middle" font-family="Kanit, sans-serif" font-weight="600" font-size="4" letter-spacing="1" fill="#ffffff">FINISHER</text>`
        : `<circle cx="50" cy="27" r="5.5" fill="#ffffff" opacity="0.85"/>
           <circle cx="50" cy="27" r="3" fill="#67a68b"/>`
      }
    </svg>`;
  }

  function renderOrderView(){
    const qtyTotal = totalQty();
    const price = totalPrice();
    const unitPrice = currentShirtPrice();
    const shippingFee = currentShippingFee();
    content.innerHTML = `
      ${state.shirtStatusError ? `<div class="status-alert">${escapeHTML(state.shirtStatusError)}</div>` : ""}

      <div class="design-card">
        <div class="design-head">
          <h3>แบบเสื้อ</h3>
          <span class="price-pill">${unitPrice} บาท / ตัว</span>
        </div>
        <div class="design-grid">
          <div class="design-piece">
            <div class="shirt-frame"><img src="assets/shirt-front-white.webp" decoding="async" fetchpriority="high" alt="แบบเสื้อที่ระลึกวิ่งล้อมเมือง ด้านหน้า" width="800" height="1414"></div>
            <div class="cap">ด้านหน้า</div>
          </div>
          <div class="design-piece">
            <div class="shirt-frame"><img src="assets/shirt-back.webp" decoding="async" alt="แบบเสื้อที่ระลึกวิ่งล้อมเมือง ด้านหลัง" width="800" height="1478"></div>
            <div class="cap">ด้านหลัง</div>
          </div>
        </div>
        <div class="design-foot">แบบเสื้อที่ระลึกวิ่งล้อมเมือง · ด้านหน้าและด้านหลัง</div>
      </div>

      <div class="field">
        <label for="inpName">ชื่อผู้สั่ง</label>
        <input type="text" id="inpName" placeholder="ชื่อ-นามสกุล" value="${escapeAttr(state.name)}">
      </div>

      <div class="field">
        <label for="inpPhone">เบอร์โทรศัพท์</label>
        <input
          type="tel"
          id="inpPhone"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="10"
          autocomplete="tel"
          placeholder="กรอกเบอร์มือถือ 10 หลัก"
          value="${escapeAttr(state.phone)}"
        >
        <div class="field-hint">ตัวเลข 10 หลัก ขึ้นต้นด้วย 06, 08 หรือ 09</div>
      </div>

      <div class="field">
        <label>เลือกไซส์และจำนวน</label>
        <div class="size-list">
          ${SIZES.map(sz=>{
            const stock = getShirtSizeStatus(sz);
            const available = Boolean(stock && stock.available);
            const remaining = stock ? Math.max(0, Number(stock.remaining) || 0) : 0;
            return `
            <div class="size-row ${state.qty[sz]>0 ? 'has-qty' : ''} ${available ? '' : 'is-unavailable'}">
              <div class="size-label">
                <span class="size-chip">${sz}</span>
                <span class="chest">รอบอก ${CHEST[sz]}"</span>
              </div>
              <div class="subtotal">${available
                ? (state.qty[sz] > 0
                  ? (state.qty[sz] * unitPrice).toLocaleString() + ' บาท'
                  : '')
                : 'หมด/ปิดรับ'}</div>
              <div class="stepper">
                <button type="button" data-minus="${sz}" aria-label="ลดจำนวนไซส์ ${sz}" ${state.qty[sz]<=0?'disabled':''}>–</button>
                <span class="qty">${state.qty[sz]}</span>
                <button type="button" data-plus="${sz}" aria-label="เพิ่มจำนวนไซส์ ${sz}" ${!available || state.qty[sz]>=remaining?'disabled':''}>+</button>
              </div>
            </div>
          `}).join("")}
        </div>
      </div>

      <div class="field">
        <label>วิธีรับเสื้อ</label>
        <div class="method-toggle">
          <button type="button" data-method="pickup_hospital" aria-pressed="${state.method==='pickup_hospital'}" class="${state.method==='pickup_hospital'?'active':''}">รับ ณ โรงพยาบาลกลาง</button>
          <button type="button" data-method="pickup_ratchathewi" aria-pressed="${state.method==='pickup_ratchathewi'}" class="${state.method==='pickup_ratchathewi'?'active':''}">รับ ณ เขตราชเทวี</button>
          <button type="button" data-method="pickup_phayathai" aria-pressed="${state.method==='pickup_phayathai'}" class="${state.method==='pickup_phayathai'?'active':''}">รับ ณ เขตพญาไท</button>
          <button type="button" data-method="mail" aria-pressed="${state.method==='mail'}" class="${state.method==='mail'?'active':''}">ส่งไปรษณีย์ (+${shippingFee} บาท)</button>
        </div>
      </div>

      ${state.method==="mail" ? `
      <div class="field">
        <label for="inpAddress">ที่อยู่จัดส่ง</label>
        <textarea id="inpAddress" placeholder="บ้านเลขที่ ถนน ตำบล/แขวง อำเภอ/เขต จังหวัด รหัสไปรษณีย์">${escapeHTML(state.address)}</textarea>
      </div>` : ""}

      <div class="summary">
        <div class="summary-row"><span>ค่าเสื้อ ${unitPrice} × ${qtyTotal}</span><span>${(qtyTotal*unitPrice).toLocaleString()}</span></div>
        ${state.method==="mail" && qtyTotal>0 ? `<div class="summary-row"><span>ค่าจัดส่ง</span><span>${shippingFee}</span></div>` : ""}
        <div class="summary-total"><span class="lbl">ยอดชำระรวม</span><span class="amt">${price.toLocaleString()} บาท</span></div>
      </div>

      <div class="payment-card">
        <div class="payment-head">
          <div>
            <h3>ชำระเงินและแนบสลิป</h3>
            <p>ชำระเงินก่อน แล้วจึงยืนยันคำสั่งซื้อ</p>
          </div>
          <span class="verified-badge">QR ยืนยันแล้ว</span>
        </div>

        <div class="payment-steps" aria-label="ขั้นตอนการชำระเงิน">
          <div class="payment-step"><span>1</span>ตรวจสอบยอด</div>
          <div class="payment-step"><span>2</span>โอนเงิน</div>
          <div class="payment-step"><span>3</span>แนบสลิป</div>
          <div class="payment-step"><span>4</span>ยืนยัน</div>
        </div>

        <div class="account-box">
          <div class="account-name">มูลนิธิโรงพยาบาลกลาง</div>
          <div class="account-no">ชำระผ่าน QR PromptPay ด้านล่าง</div>
          <div class="payment-amount">
            <div>
              <div class="label">ยอดที่ต้องชำระ</div>
              <strong>${price.toLocaleString()} บาท</strong>
            </div>
            <button type="button" class="copy-btn" id="copyAmountBtn" ${price<=0?'disabled':''}>คัดลอกยอด</button>
          </div>

          <details class="qr-payment">
            <summary>
              <span class="open-label">แสดง QR ชำระเงิน</span>
              <span class="close-label">ซ่อน QR ชำระเงิน</span>
            </summary>
            <div class="qr-panel">
              <h4>QR ชำระค่าเสื้อ</h4>
              <p>สแกนด้วยแอปธนาคาร และตรวจสอบยอดก่อนชำระเงิน</p>
              <img src="assets/payment-qr.jpg" alt="QR PromptPay มูลนิธิโรงพยาบาลกลาง" width="1127" height="1090" decoding="async" loading="lazy">
              <strong class="qr-amount">ยอดชำระ ${price.toLocaleString()} บาท</strong>
            </div>
          </details>

          <div class="payment-warning" role="alert">
            <span class="warning-icon" aria-hidden="true">!</span>
            <div><strong>โปรดตรวจสอบก่อนโอน:</strong> กรุณาตรวจสอบจำนวนเสื้อและยอดชำระอีกครั้งก่อนโอนเงิน โดยเฉพาะเมื่อสินค้าใกล้หมด QR นี้ไม่ระบุจำนวนเงินอัตโนมัติ กรุณากรอกยอดให้ตรงกับที่แสดงด้านบน</div>
          </div>
        </div>

        <div class="slip-section">
          <label for="inpSlip">หลักฐานการชำระเงิน <span class="required-mark">*</span></label>
          ${state.slipProcessing ? `
            <div class="slip-picker">${state.slipProcessStage==='uploading'
              ? 'กำลังอัปโหลดสลิป กรุณารอสักครู่...'
              : 'กำลังย่อและบีบอัดรูปสลิป...'}</div>
          ` : state.slipFile ? `
            <div class="slip-preview">
              <img src="${escapeAttr(state.slipPreviewUrl)}" alt="ภาพตัวอย่างสลิปที่เลือก">
              <div class="slip-meta">
                <strong>สลิปพร้อมยืนยันคำสั่งซื้อ</strong>
                <span title="${escapeAttr(state.slipFile.name)}">${escapeHTML(state.slipFile.name)}</span>
                <span>${state.slipOriginalSize > state.slipFile.size
                  ? `ย่อจาก ${formatFileSize(state.slipOriginalSize)} เหลือ ${formatFileSize(state.slipFile.size)}`
                  : `${formatFileSize(state.slipFile.size)} อัปโหลดแล้ว`}</span>
              </div>
              <button type="button" class="remove-slip" id="removeSlipBtn">ลบ</button>
            </div>
            <label class="slip-picker" for="inpSlip" style="margin-top:9px;">เปลี่ยนรูปสลิป</label>
          ` : `
            <label class="slip-picker" for="inpSlip">
              แตะเพื่อเลือกหรือถ่ายรูปสลิป
              <small>รองรับ JPG, PNG, WebP ระบบจะย่อรูปอัตโนมัติก่อนส่ง</small>
            </label>
          `}
          <input class="slip-input" type="file" id="inpSlip" accept="image/jpeg,image/png,image/webp" ${state.slipProcessing?'disabled':''}>
          ${state.slipError ? `<div class="error-text">${escapeHTML(state.slipError)}</div>` : ""}
        </div>

      <div class="prototype-note">คำสั่งซื้อสำเร็จเมื่อระบบแสดงเลขคำสั่งซื้อ <strong>HC-...</strong> กรุณาบันทึกเลขไว้เพื่อตรวจสอบสถานะ</div>
      </div>

      ${state.error ? `<div class="error-text">${escapeHTML(state.error)}</div>` : ""}

      <div class="privacy-consent">เมื่อยืนยันคำสั่งซื้อ ถือว่าท่านรับทราบ <a href="privacy.html" target="_blank" rel="noopener">ประกาศความเป็นส่วนตัว</a></div>

      <button class="submit-btn" id="submitBtn" ${(state.submitting || state.slipProcessing || !state.slipFile || !state.slipUploadToken || qtyTotal<=0)?'disabled':''}>
        ${state.slipProcessing
          ? 'กำลังเตรียมสลิป...'
          : state.submitting
            ? (state.submitStage==='checking' ? 'กำลังตรวจสอบข้อมูล...' : 'กำลังบันทึก กรุณารอสักครู่...')
            : 'ยืนยันคำสั่งซื้อ'}
      </button>
      ${!state.slipFile ? `<div class="submit-hint">กรุณาเลือกเสื้อและแนบสลิปก่อนยืนยันคำสั่งซื้อ</div>` : ""}
    `;

    document.getElementById("inpName").addEventListener("input", e=>{ state.name = e.target.value; });
    document.getElementById("inpPhone").addEventListener("input", e=>{
      const digits = e.target.value.replace(/\D/g, "").slice(0, 10);
      e.target.value = digits;
      state.phone = digits;
    });
    if(state.method==="mail"){
      document.getElementById("inpAddress").addEventListener("input", e=>{ state.address = e.target.value; });
    }
    content.querySelectorAll("[data-plus]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const sz = btn.getAttribute("data-plus");
        const stock = getShirtSizeStatus(sz);
        const remaining = stock ? Math.max(0, Number(stock.remaining) || 0) : 0;
        if(!stock || !stock.available || state.qty[sz] >= remaining) return;
        state.qty[sz]++;
        render();
      });
    });
    content.querySelectorAll("[data-minus]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const sz = btn.getAttribute("data-minus");
        state.qty[sz] = Math.max(0, state.qty[sz]-1);
        render();
      });
    });
    content.querySelectorAll("[data-method]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.method = btn.getAttribute("data-method");
        render();
      });
    });
    document.getElementById("inpSlip").addEventListener("change", handleSlipSelect);
    const removeSlipBtn = document.getElementById("removeSlipBtn");
    if(removeSlipBtn){
      removeSlipBtn.addEventListener("click", ()=>{
        clearSlip();
        render();
      });
    }
    document.getElementById("copyAmountBtn").addEventListener("click", async e=>{
      if(price <= 0) return;
      const btn = e.currentTarget;
      try{
        if(!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("clipboard unavailable");
        await navigator.clipboard.writeText(String(price));
        btn.textContent = "คัดลอกแล้ว";
        setTimeout(()=>{ btn.textContent = "คัดลอกยอด"; }, 1200);
      }catch(err){
        state.error = "ไม่สามารถคัดลอกยอดได้ กรุณาดูยอดจากหน้าจอ";
        render();
      }
    });
    document.getElementById("submitBtn").addEventListener("click", submitOrder);
  }

  function formatFileSize(bytes){
    if(bytes < 1024*1024) return `${Math.max(1, Math.round(bytes/1024))} KB`;
    return `${(bytes/(1024*1024)).toFixed(1)} MB`;
  }

  function clearSlip(){
    if(state.slipPreviewUrl){ URL.revokeObjectURL(state.slipPreviewUrl); }
    state.slipFile = null;
    state.slipPreviewUrl = "";
    state.slipOriginalSize = 0;
    state.slipProcessStage = "";
    state.slipUploadToken = "";
    state.slipError = "";
  }

  function loadSlipImage(file){
    return new Promise((resolve, reject)=>{
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = ()=>{
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror = ()=>{
        URL.revokeObjectURL(url);
        reject(new Error("ไม่สามารถอ่านรูปสลิปได้ กรุณาเลือกรูปใหม่"));
      };
      image.src = url;
    });
  }

  function canvasToSlipBlob(canvas, quality){
    return new Promise((resolve, reject)=>{
      canvas.toBlob(
        blob=>blob ? resolve(blob) : reject(new Error("ไม่สามารถย่อรูปสลิปได้")),
        "image/jpeg",
        quality
      );
    });
  }

  async function compressSlipImage(file){
    const serverLimit = Math.max(1, currentMaxSlipMb())*1024*1024;
    const targetBytes = Math.min(1024*1024, Math.floor(serverLimit*0.9));
    if(file.size <= targetBytes) return file;

    const image = await loadSlipImage(file);
    const scale = Math.min(1, 1600/Math.max(image.naturalWidth, image.naturalHeight));
    let width = Math.max(1, Math.round(image.naturalWidth*scale));
    let height = Math.max(1, Math.round(image.naturalHeight*scale));
    let quality = 0.84;
    let blob = null;

    for(let attempt=0; attempt<8; attempt++){
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      if(!context) throw new Error("อุปกรณ์นี้ไม่รองรับการย่อรูป กรุณาเลือกรูปที่มีขนาดเล็กลง");
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);
      context.drawImage(image, 0, 0, width, height);
      blob = await canvasToSlipBlob(canvas, quality);
      if(blob.size <= targetBytes) break;
      if(quality > 0.62) quality -= 0.08;
      else {
        width = Math.max(1, Math.round(width*0.85));
        height = Math.max(1, Math.round(width*image.naturalHeight/image.naturalWidth));
        quality = 0.72;
      }
    }

    if(!blob || blob.size > serverLimit){
      throw new Error(`ไม่สามารถย่อสลิปให้ต่ำกว่า ${currentMaxSlipMb()} MB ได้ กรุณาเลือกรูปใหม่`);
    }
    const baseName = String(file.name || "slip").replace(/\.[^.]+$/, "");
    return new File([blob], baseName + "-compressed.jpg", {type:"image/jpeg"});
  }

  async function handleSlipSelect(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const allowedTypes = ["image/jpeg","image/png","image/webp"];
    if(!allowedTypes.includes(file.type)){
      state.slipError = "กรุณาเลือกไฟล์รูปภาพ JPG, PNG หรือ WebP";
      render();
      return;
    }
    if(file.size > 15*1024*1024){
      state.slipError = "รูปต้นฉบับต้องมีขนาดไม่เกิน 15 MB";
      render();
      return;
    }
    clearSlip();
    state.slipProcessing = true;
    state.slipProcessStage = "compressing";
    render();
    try{
      const compressedFile = await compressSlipImage(file);
      state.slipOriginalSize = file.size;
      state.slipFile = compressedFile;
      state.slipPreviewUrl = URL.createObjectURL(compressedFile);
      if(!state.pendingRequestId) state.pendingRequestId = createRequestId();
      state.slipProcessStage = "uploading";
      render();
      const slipBase64 = await fileToBase64(compressedFile);
      const response = await fetch(WEB_APP_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({
          action:"shirt-slip-upload",
          requestId:state.pendingRequestId,
          slip:{
            fileName:compressedFile.name,
            mimeType:compressedFile.type,
            base64:slipBase64
          }
        }),
        redirect:"follow"
      });
      if(!response.ok) throw new Error("อัปโหลดสลิปไม่สำเร็จ กรุณาลองใหม่");
      const result = await response.json();
      if(!result.success || !result.uploadToken){
        throw new Error(result.message || "อัปโหลดสลิปไม่สำเร็จ กรุณาลองใหม่");
      }
      state.slipUploadToken = result.uploadToken;
    }catch(error){
      if(state.slipPreviewUrl){ URL.revokeObjectURL(state.slipPreviewUrl); }
      state.slipFile = null;
      state.slipPreviewUrl = "";
      state.slipOriginalSize = 0;
      state.slipUploadToken = "";
      state.slipError = error && error.message
        ? error.message
        : "ไม่สามารถเตรียมรูปสลิปได้ กรุณาเลือกรูปใหม่";
    }finally{
      state.slipProcessing = false;
      state.slipProcessStage = "";
      render();
    }
  }

  function createRequestId(){
    if(window.crypto && typeof window.crypto.randomUUID === "function"){
      return window.crypto.randomUUID();
    }
    return "shirt-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const value = String(reader.result || "");
        const commaIndex = value.indexOf(",");
        if(commaIndex < 0) reject(new Error("อ่านไฟล์สลิปไม่สำเร็จ"));
        else resolve(value.slice(commaIndex + 1));
      };
      reader.onerror = ()=>reject(new Error("อ่านไฟล์สลิปไม่สำเร็จ"));
      reader.readAsDataURL(file);
    });
  }

  async function submitOrder(){
    if(state.submitting || state.slipProcessing) return;
    state.error = "";
    const qtyTotal = totalQty();
    if(!state.name.trim()){ state.error = "กรุณากรอกชื่อผู้สั่ง"; render(); return; }
    if(!state.phone.trim()){ state.error = "กรุณากรอกเบอร์โทรศัพท์"; render(); return; }
    if(!/^0[689]\d{8}$/.test(state.phone)){
      state.error = "กรุณากรอกเบอร์มือถือ 10 หลัก โดยขึ้นต้นด้วย 06, 08 หรือ 09";
      render();
      return;
    }
    if(qtyTotal <= 0){ state.error = "กรุณาเลือกจำนวนเสื้ออย่างน้อย 1 ตัว"; render(); return; }
    if(state.method==="mail" && !state.address.trim()){ state.error = "กรุณากรอกที่อยู่จัดส่ง"; render(); return; }
    if(!state.slipFile || !state.slipUploadToken){ state.error = "กรุณารอให้อัปโหลดสลิปเรียบร้อยก่อนยืนยันคำสั่งซื้อ"; render(); return; }

    // สลิปอัปโหลดไว้แล้ว จึงล็อกปุ่มและส่งเฉพาะข้อมูลคำสั่งซื้อ
    state.submitting = true;
    state.submitStage = "saving";
    render();

    try{
      const items = SIZES
        .filter(size=>state.qty[size] > 0)
        .map(size=>({size, quantity:state.qty[size]}));
      const response = await fetch(WEB_APP_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({
          action:"shirt-order",
          requestId:state.pendingRequestId,
          buyerName:state.name.trim(),
          phone:state.phone.trim(),
          deliveryMethod:state.method,
          addressLine:state.method==="mail" ? state.address.trim() : "",
          clientTotal:totalPrice(),
          items,
          slipUploadToken:state.slipUploadToken
        }),
        redirect:"follow"
      });
      if(!response.ok) throw new Error("เชื่อมต่อระบบบันทึกคำสั่งซื้อไม่สำเร็จ");
      const result = await response.json();
      if(!result.success) throw new Error(result.message || "บันทึกคำสั่งซื้อไม่สำเร็จ");

      const resultSizes = emptyQty();
      (result.items || items).forEach(item=>{
        const size = String(item.size || "").toUpperCase();
        if(size in resultSizes) resultSizes[size] = Number(item.quantity) || 0;
      });
      const order = {
        orderNo:result.orderId,
        name:result.buyerName || state.name.trim(),
        phone:result.phone || state.phone.trim(),
        sizes:resultSizes,
        qtyTotal:Number(result.totalQty) || qtyTotal,
        method:result.deliveryMethod || state.method,
        pickupLocation:result.pickupLocation || "",
        address:result.addressLine || (state.method==="mail" ? state.address.trim() : ""),
        total:Number(result.grandTotal),
        paymentSlip:{attached:true},
        status:"รอตรวจสอบการชำระเงิน",
        ts:Date.now()
      };

      state.confirmedOrder = order;
      state.name=""; state.phone=""; state.address="";
      state.qty = emptyQty();
      state.method = "pickup_hospital";
      state.pendingRequestId = "";
      clearSlip();
      state.submitting = false;
      state.submitStage = "";
      render();
    }catch(e){
      state.submitting = false;
      state.submitStage = "";
      state.error = e && e.message
        ? e.message
        : "บันทึกคำสั่งซื้อไม่สำเร็จ กรุณาลองใหม่อีกครั้ง";
      render();
    }
  }

  function renderConfirmation(){
    const o = state.confirmedOrder;
    const sizesText = SIZES.filter(s=>o.sizes[s]>0).map(s=>`${s} ${o.sizes[s]} ตัว`).join(", ");
    content.innerHTML = `
      <div class="confirm">
        <div class="check">✓</div>
        <h3>ยืนยันคำสั่งซื้อแล้ว</h3>
        <p>ขอบคุณที่ร่วมสนับสนุนมูลนิธิโรงพยาบาลกลาง</p>
        <div class="ref">เลขที่คำสั่งซื้อ ${escapeHTML(o.orderNo)}</div>
        <div class="note">
          <strong>${escapeHTML(o.name)}</strong> · ${escapeHTML(o.phone)}<br>
          ${sizesText} (รวม ${o.qtyTotal} ตัว)<br>
          วิธีรับ: ${escapeHTML(methodLabel(o.method, o.pickupLocation))}<br>
          ${o.address ? 'ที่อยู่: '+escapeHTML(o.address)+'<br>' : ''}
          ยอดชำระ: <strong>${o.total.toLocaleString()} บาท</strong><br>
          หลักฐานการชำระเงิน: <strong>แนบแล้ว</strong><br>
          สถานะ: <strong>${escapeHTML(o.status)}</strong><br><br>
          ระบบได้รับคำสั่งซื้อและข้อมูลสลิปแล้ว กรุณาเก็บเลขที่คำสั่งซื้อไว้สำหรับตรวจสอบสถานะ
        </div>
        <br>
        <button class="back-btn" id="backBtn">สั่งซื้อเสื้อเพิ่ม</button>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", ()=>{
      state.confirmedOrder = null;
      render();
    });
  }

  function methodLabel(m, pickupLocation){
    const labels = {
      pickup_hospital: "รับ ณ โรงพยาบาลกลาง",
      pickup_ratchathewi: "รับ ณ เขตราชเทวี",
      pickup_phayathai: "รับ ณ เขตพญาไท",
      mail: "ส่งไปรษณีย์"
    };
    if(Object.prototype.hasOwnProperty.call(labels, m)) return labels[m];
    if(m === "pickup"){
      const locations = ["โรงพยาบาลกลาง", "เขตราชเทวี", "เขตพญาไท"];
      return locations.includes(pickupLocation)
        ? "รับ ณ " + pickupLocation
        : "รับด้วยตนเอง (ยังไม่ระบุจุดรับ)";
    }
    return "ไม่ระบุวิธีรับ";
  }

  function normalizeOrderNo(value){
    return String(value || "").trim().toUpperCase().replace(/\s+/g, "");
  }

  function maskName(name){
    return String(name || "").trim().split(/\s+/).map(part=>{
      if(part.length <= 1) return part + "***";
      return part.slice(0, 2) + "***";
    }).join(" ");
  }

  function maskPhone(phone){
    const p = String(phone || "");
    return p.length === 10 ? `${p.slice(0,2)}X-XXX-${p.slice(-4)}` : "ข้อมูลถูกปิดบัง";
  }

  function renderLookup(){
    let resultHTML = "";
    if(state.lookupLoading){
      resultHTML = `<div class="loading">กำลังตรวจสอบคำสั่งซื้อ...</div>`;
    } else if(state.lookupResults.length){
      const cards = state.lookupResults.map(o=>{
        const sizesText = Array.isArray(o.items)
          ? o.items.filter(item=>item.quantity>0).map(item=>`${escapeHTML(item.size)} × ${item.quantity}`).join(" · ")
          : SIZES.filter(s=>o.sizes && o.sizes[s]>0).map(s=>`${s} × ${o.sizes[s]}`).join(" · ");
        const d = new Date(o.ts);
        const timeStr = Number.isNaN(d.getTime()) ? '-' : d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'});
        return `
          <div class="order-card">
            <div class="top">
              <span class="name">${escapeHTML(o.displayName || maskName(o.name))}</span>
              <span class="time">${timeStr}</span>
            </div>
            <div class="order-ref">เลขที่คำสั่งซื้อ ${escapeHTML(o.orderNo)}</div>
            <div class="masked-contact">📞 ${escapeHTML(o.displayPhone || maskPhone(o.phone))}</div>
            <div class="sizes">${sizesText} · รวม ${o.qtyTotal} ตัว</div>
            <div class="bottom">
              <span class="method-badge">${escapeHTML(methodLabel(o.method || o.deliveryMethod, o.pickupLocation))}</span>
              <span class="amt">${o.total.toLocaleString()} บาท</span>
            </div>
            <div class="status-line">สถานะ: <strong>${escapeHTML(o.status || "รอตรวจสอบ")}</strong></div>
          </div>
        `;
      }).join("");
      resultHTML = `<div class="lookup-count">พบ ${state.lookupResults.length} คำสั่งซื้อจากเบอร์นี้</div>${cards}`;
    }

    content.innerHTML = `
      <div class="lookup-card">
        <h2>ตรวจสอบคำสั่งซื้อ</h2>
        <p class="intro">กรอกเบอร์โทรศัพท์ที่ใช้สั่งซื้อเพียงอย่างเดียว หากมีหลายคำสั่งซื้อ ระบบจะแสดงทุกรายการจากเบอร์นี้</p>

        <div class="field">
          <label for="lookupPhone">เบอร์โทรศัพท์ที่ใช้สั่งซื้อ</label>
          <input type="tel" id="lookupPhone" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="tel" placeholder="กรอกเบอร์มือถือ 10 หลัก" value="${escapeAttr(state.lookupPhone)}">
        </div>

        ${state.lookupError ? `<div class="error-text">${escapeHTML(state.lookupError)}</div>` : ""}
        <button class="submit-btn" id="lookupBtn" ${state.lookupLoading?'disabled':''}>${state.lookupLoading?'กำลังตรวจสอบ...':'ตรวจสอบคำสั่งซื้อ'}</button>

        <div class="privacy-note">เพื่อความเป็นส่วนตัว ระบบแสดงชื่อและเบอร์โทรแบบปิดบัง และไม่แสดงที่อยู่จัดส่งหรือหลักฐานการชำระเงิน</div>
      </div>
      ${resultHTML}
    `;

    document.getElementById("lookupPhone").addEventListener("input", e=>{
      const digits = e.target.value.replace(/\D/g, "").slice(0, 10);
      e.target.value = digits;
      state.lookupPhone = digits;
    });
    document.getElementById("lookupBtn").addEventListener("click", lookupOrder);
  }

  async function lookupOrder(){
    const phone = state.lookupPhone;
    state.lookupError = "";
    state.lookupResults = [];

    if(!/^0[689]\d{8}$/.test(phone)){
      state.lookupError = "กรุณากรอกเบอร์มือถือ 10 หลักที่ใช้สั่งซื้อ";
      render();
      return;
    }

    state.lookupLoading = true;
    render();
    try{
      const response = await fetch(WEB_APP_URL + '?action=shirt-lookup&phone=' + encodeURIComponent(phone), {
        method:'GET',
        cache:'no-store',
        redirect:'follow'
      });
      if(!response.ok) throw new Error('เชื่อมต่อระบบตรวจสอบคำสั่งซื้อไม่สำเร็จ');
      const result = await response.json();
      if(!result.success) throw new Error(result.message || 'ตรวจสอบคำสั่งซื้อไม่สำเร็จ');
      const orders = Array.isArray(result.orders) ? result.orders : [];
      if(!orders.length) throw new Error("ไม่พบคำสั่งซื้อจากเบอร์โทรศัพท์นี้ กรุณาตรวจสอบหมายเลขอีกครั้ง");
      state.lookupResults = orders;
    }catch(e){
      state.lookupError = e && e.message
        ? e.message
        : "ตรวจสอบคำสั่งซื้อไม่สำเร็จ กรุณาลองใหม่อีกครั้ง";
    }
    state.lookupLoading = false;
    render();
  }

  function renderStoreGate(){
    const loading = state.shirtStatusLoading;
    const status = state.shirtStatus;
    let title = 'กำลังตรวจสอบสถานะร้าน';
    let message = 'กรุณารอสักครู่';
    let icon = '…';

    if(!loading){
      if(state.shirtStatusError || !status){
        title = 'ยังไม่สามารถเปิดฟอร์มได้';
        message = state.shirtStatusError || 'ไม่สามารถตรวจสอบสถานะร้านได้';
        icon = '!';
      }else if(status.reason === 'sold_out'){
        title = 'เสื้อหมดแล้ว';
        message = status.message || 'เสื้อหมดทุกไซซ์แล้ว';
        icon = '✓';
      }else{
        title = 'ขณะนี้ปิดรับคำสั่งซื้อ';
        message = status.message || 'กรุณาติดตามประกาศเปิดรับอีกครั้ง';
        icon = '–';
      }
    }

    content.innerHTML = `
      <div class="store-gate ${loading?'loading':''}">
        <div class="icon">${icon}</div>
        <h2>${escapeHTML(title)}</h2>
        <p>${escapeHTML(message)}</p>
        ${loading ? '' : '<button type="button" id="retryStatusBtn">ตรวจสอบอีกครั้ง</button>'}
      </div>
    `;
    const retryButton = document.getElementById('retryStatusBtn');
    if(retryButton) retryButton.addEventListener('click', ()=>refreshShirtStatus());
  }

  function render(){
    tabOrder.classList.toggle("active", state.view==="order");
    tabLookup.classList.toggle("active", state.view==="lookup");
    if(state.view==="order"){
      if(state.confirmedOrder){ renderConfirmation(); }
      else if(state.shirtStatusLoading || !state.shirtStatus || !state.shirtStatus.acceptingOrders){ renderStoreGate(); }
      else { renderOrderView(); }
    } else {
      renderLookup();
    }
  }

  function escapeHTML(str){
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(str){ return escapeHTML(str); }

  tabOrder.addEventListener("click", ()=>{ state.view="order"; render(); });
  tabLookup.addEventListener("click", ()=>{ state.view="lookup"; render(); });

  render();
  refreshShirtStatus();
  setInterval(()=>refreshShirtStatus({silent:true}), 60000);
})();
</script>
